only_rules:
  - fatal_error_message
  - legacy_cggeometry_functions
  - legacy_constant
  - legacy_constructor
  - legacy_nsgeometry_functions
  - unused_optional_binding
  - superfluous_disable_command
  - invalid_swiftlint_command
  - custom_rules

excluded:
  - Carthage
  - Pods
  - .build
  - '**.build'
  - vendor

colon:
  apply_to_dictionaries: false

indentation: 2

custom_rules:
  no_objcMembers:
    name: "@objcMembers"
    regex: "@objcMembers"
    message: "Explicitly use @objc on each member you want to expose to Objective-C"
    severity: error
  no_file_literal:
    name: "#file is disallowed"
    regex: "(#file\\b)"
    match_kinds:
    - keyword
    message: "Instead of #file, use #fileID by default, or #filePath if you need the exact file path"
    severity: error
